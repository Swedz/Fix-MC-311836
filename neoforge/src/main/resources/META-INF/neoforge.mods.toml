modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"
issueTrackerURL = "${mod_github}/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
iconFile = "assets/${mod_id}/logo.png"
displayURL = "${mod_github}"

[[mixins]]
config = "${mod_id}.common.mixins.json"

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[accessTransformers]]
file = "${mod_id}.neoforge.accesstransformer.cfg"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"